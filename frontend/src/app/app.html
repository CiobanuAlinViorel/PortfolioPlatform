<a class="skip-link" href="#main-content">Skip to content</a>
@if (isAdminRoute()) {
  <app-slow-request-banner />
  <main id="main-content" tabindex="-1" class="outline-none">
    <app-sidebar />
    <div class="flex min-h-screen flex-col bg-surface-raised dark:bg-green-950 md:ml-64 md:h-screen">
      <router-outlet />
    </div>
  </main>
} @else {
  <app-header />
  <app-slow-request-banner />
  <main id="main-content" tabindex="-1" class="outline-none">
    <router-outlet />
  </main>
  <app-footer />
}
<app-toast-host />
